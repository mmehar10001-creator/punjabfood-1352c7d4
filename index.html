<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab Foods — Authentic Pulao & Kabab, Rawalpindi</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header / Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-red-600 tracking-wide">PUNJAB FOODS</a>
            <nav class="hidden md:flex space-x-6 font-medium text-gray-600">
                <a href="#menu" class="hover:text-red-600">Menu</a>
                <a href="#catering" class="hover:text-red-600">Catering</a>
                <a href="#contact" class="hover:text-red-600">Contact</a>
            </nav>
            <a href="tel:0515706222" class="bg-red-600 text-white px-5 py-2 rounded-full font-medium hover:bg-red-700">Order Now</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-orange-50 py-20 text-center">
        <h1 class="text-5xl font-extrabold text-gray-900">Punjab Foods</h1>
        <p class="text-xl text-gray-600 mt-2">Authentic Pulao · Kabab · Roast in Rawalpindi</p>
    </section>

    <!-- Menu Section (Summary) -->
    <section id="menu" class="py-16 bg-white">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-10">Signature Menu</h2>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="border p-4 rounded text-center">Chicken Pulao<br><span class="text-red-600 font-bold">from Rs. 430</span></div>
                <div class="border p-4 rounded text-center">Chicken Roast<br><span class="text-red-600 font-bold">from Rs. 700</span></div>
                <div class="border p-4 rounded text-center">Shami Kabab<br><span class="text-red-600 font-bold">Rs. 540/doz</span></div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <footer id="contact" class="bg-gray-900 text-gray-300 p-10">
        <div class="container mx-auto text-center">
            <h3 class="text-xl font-bold text-white mb-4">Contact Us</h3>
            <p>Sirsyed Chowk, Tipu Road, Rawalpindi</p>
            <p class="mt-2"><a href="tel:0515706222" class="text-red-400">051-5706222</a> | <a href="https://wa.me" class="text-green-400">WhatsApp</a></p>
        </div>
    </footer>

</body>
</html>
